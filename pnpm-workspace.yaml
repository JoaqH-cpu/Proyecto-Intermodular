packages:
  - "apps/*"
  - "packages/*"

# Medusa necesita su scope y estas librerías del admin en el node_modules raíz.
# Fuente: https://docs.medusajs.com/learn/configurations/pnpm
publicHoistPattern:
  - "*@medusajs/*"
  - "@tanstack/react-query"
  - "react-i18next"
  - "react-router-dom"

# Paquetes a los que se permite ejecutar scripts de instalación (pnpm no los ejecuta por defecto).
allowBuilds:
  "@swc/core": true
  msgpackr-extract: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  "@medusajs/telemetry": false
