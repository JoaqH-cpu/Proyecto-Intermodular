# Base de datos y caché para desarrollo local. Arranque: pnpm db:up
name: clavapalos

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: clavapalos
      POSTGRES_PASSWORD: clavapalos
      POSTGRES_DB: clavapalos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clavapalos -d clavapalos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
